name: OrcaSlicer Sidecar
slug: orcaslicer_sidecar
description: OrcaSlicer API sidecar for Bambuddy server-side slicing
version: "2.3.1"
url: https://github.com/YOUR_GITHUB_USER/ha-orcaslicer-sidecar/tree/main/orcaslicer-sidecar

arch:
  - amd64
  - aarch64

startup: services
boot: auto
init: false
stage: experimental

ports:
  3000/tcp: 3003

ports_description:
  3000/tcp: OrcaSlicer API endpoint for Bambuddy

map:
  - addon_config:rw

environment:
  NODE_ENV: production
  PORT: "3000"
  DATA_PATH: /app/data

watchdog: http://[HOST]:[PORT:3000]/health

image: ghcr.io/tzimpel/homeassistant-bambuddy-sidecar-apps
