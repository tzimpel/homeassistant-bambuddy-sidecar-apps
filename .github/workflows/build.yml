name: Build OrcaSlicer Sidecar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "orcaslicer-sidecar/config.yaml"

env:
  IMAGE_NAME: ghcr.io/tzimpel/homeassistant-bambuddy-sidecar-apps
  ORCA_VERSION: "2.3.1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/maziggy/orca-slicer-api.git#bambuddy/profile-resolver
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ORCA_VERSION=${{ env.ORCA_VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.ORCA_VERSION }}
            ${{ env.IMAGE_NAME }}:latest
